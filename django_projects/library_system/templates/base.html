<!DOCTYPE html>
<html>
<head>
    <title>Library System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f9; }
        nav { background: #0f3460; padding: 12px; border-radius: 6px; margin-bottom: 20px; }
        nav a { color: white; margin-right: 20px; text-decoration: none; font-weight: bold; }
        table { border-collapse: collapse; width: 100%; background: white; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #e94560; color: white; }
        form input, form select { padding: 6px; margin: 6px 0; width: 300px; }
        .btn { background: #e94560; color: white; padding: 8px 16px; border: none;
               border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'book_list' %}">Books</a>
        <a href="{% url 'member_list' %}">Members</a>
        <a href="{% url 'reservation_list' %}">Reservations</a>
    </nav>
    {% block content %}
    {% endblock %}
</body>
</html>
